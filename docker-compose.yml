# Remove 'name: coder' and 'version', they are obsolete/incorrectly placed
services:
  db:
    image: postgres:16
    container_name: coder-db # Added for easier debugging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
